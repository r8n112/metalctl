[package]
name = "metalctl"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
description = "Low-level CLI and library for the Hetzner Robot (bare-metal) API"
repository = "https://github.com/r8n112/metalctl"
keywords = ["hetzner", "robot", "bare-metal", "cli", "api"]
categories = ["command-line-utilities", "api-bindings"]
readme = "README.md"

[lib]
name = "metalctl"
path = "src/lib.rs"

[[bin]]
name = "metalctl"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"
unsafe_op_in_unsafe_fn = "deny"
elided_lifetimes_in_paths = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "allow"
doc_markdown = "warn"
