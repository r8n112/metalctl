[package]
name = "metalctl-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "MCP server exposing the Hetzner Robot API via metalctl"
repository = "https://github.com/r8n112/metalctl"
publish = false

[[bin]]
name = "metalctl-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
metalctl = { path = "../.." }
rmcp = { version = "3.3", features = ["server", "macros", "transport-io"] }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "allow"
doc_markdown = "warn"
